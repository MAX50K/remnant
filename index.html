<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Remnant: memories, as they come back wrong</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d140a">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Remnant">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght,SOFT,WONK@9..144,300..700,0..100,0..1&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
:root{
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  --m:.1;
  /* each pair is warm / cold; the page blends them with the Mood slider */
  --bw:#f0e1c0;--bc:#e3dfa0;
  --pw:#e7d4ac;--pc:#d8d48c;
  --iw:#2a1b0e;--ic:#2a290d;
  --mw:#6d5738;--mc:#64621f;
  --aw:#9a6410;--ac:#6c7216;
  --lw:#cdb78a;--lc:#bab66c;
  --sw:#1d140a;--sc:#1b1b0b;
  --bg:color-mix(in srgb,var(--bw),var(--bc) calc(var(--m) * 100%));
  --panel:color-mix(in srgb,var(--pw),var(--pc) calc(var(--m) * 100%));
  --ink:color-mix(in srgb,var(--iw),var(--ic) calc(var(--m) * 100%));
  --mute:color-mix(in srgb,var(--mw),var(--mc) calc(var(--m) * 100%));
  --accent:color-mix(in srgb,var(--aw),var(--ac) calc(var(--m) * 100%));
  --line:color-mix(in srgb,var(--lw),var(--lc) calc(var(--m) * 100%));
  --stage:color-mix(in srgb,var(--sw),var(--sc) calc(var(--m) * 100%));
  --serif:'Fraunces',Georgia,'Times New Roman',serif;
  --sans:'Figtree',system-ui,-apple-system,'Segoe UI',sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bw:#1f160c;--bc:#1d1d0c;--pw:#2a1e12;--pc:#292910;
    --iw:#f1e0bd;--ic:#eae8b2;--mw:#a8926d;--mc:#a5a268;
    --aw:#e9b04a;--ac:#d9d34c;--lw:#3d2d1b;--lc:#3b3a19;
    --sw:#120c06;--sc:#0f0f06;
  }
}
:root[data-theme="dark"]{
  --bw:#1f160c;--bc:#1d1d0c;--pw:#2a1e12;--pc:#292910;
  --iw:#f1e0bd;--ic:#eae8b2;--mw:#a8926d;--mc:#a5a268;
  --aw:#e9b04a;--ac:#d9d34c;--lw:#3d2d1b;--lc:#3b3a19;
  --sw:#120c06;--sc:#0f0f06;
}
@supports not (color: color-mix(in srgb, red, blue)){
  :root{--bg:var(--bw);--panel:var(--pw);--ink:var(--iw);--mute:var(--mw);--accent:var(--aw);--line:var(--lw);--stage:var(--sw)}
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:15px;line-height:1.5;min-height:100%}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}

.app{max-width:1380px;margin:0 auto;padding:18px 22px 64px;display:grid;grid-template-columns:88px minmax(0,1fr);grid-template-areas:"bar bar" "rooms stage";column-gap:30px;align-items:start}
@media (max-width:1060px){.app{grid-template-columns:minmax(0,1fr);grid-template-areas:"bar" "rooms" "stage";padding:14px 16px 56px}}

/* header */
.bar{grid-area:bar;display:flex;align-items:flex-end;justify-content:space-between;gap:16px;padding-bottom:16px;margin-bottom:22px;border-bottom:1px solid var(--line)}
.mark{font-family:var(--serif);font-weight:300;font-size:clamp(36px,5.5vw,56px);line-height:1;margin:0;letter-spacing:-.02em;font-variation-settings:'SOFT' 100,'WONK' 1,'opsz' 144}
.tag{margin:8px 0 0;color:var(--mute);font-family:var(--serif);font-size:16px}
.bar-act{display:flex;gap:8px;flex-shrink:0}

/* buttons */
.btn{background:var(--ink);color:var(--bg);border:1px solid var(--ink);border-radius:4px;padding:8px 15px;font-weight:500;cursor:pointer;white-space:nowrap}
.btn:hover{filter:brightness(1.12)}
.btn.ghost{background:transparent;color:var(--ink);border-color:var(--line)}
.btn.ghost:hover{border-color:var(--ink);filter:none}
.btn:disabled{opacity:.4;cursor:default;filter:none}
.btn.rec{background:#b3261e;border-color:#b3261e;color:#fff}
.link{background:none;border:0;padding:0;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:13px}

/* rooms */
.rooms{grid-area:rooms;display:flex;flex-direction:column;gap:4px;position:sticky;top:14px}
.room{display:flex;flex-direction:column;align-items:flex-start;gap:7px;padding:12px 10px;background:none;border:0;border-left:2px solid transparent;color:var(--mute);font-size:13.5px;font-weight:500;cursor:pointer;text-align:left}
.room:hover{color:var(--ink)}
.room[aria-selected=true]{color:var(--ink);border-left-color:var(--accent)}
.room svg{width:28px;height:28px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
@media (max-width:1060px){
  .rooms{position:static;flex-direction:row;margin-bottom:16px;border-bottom:1px solid var(--line)}
  .room{flex:1;flex-direction:row;align-items:center;justify-content:center;gap:8px;border-left:0;border-bottom:2px solid transparent;padding:10px 4px;margin-bottom:-1px}
  .room[aria-selected=true]{border-bottom-color:var(--accent)}
  .room svg{width:20px;height:20px}
}
@media (max-width:480px){.room span{font-size:12.5px}.room svg{display:none}}

/* source bar */
.stagecol{grid-area:stage;min-width:0;display:grid;grid-template-columns:minmax(0,1fr) 340px;column-gap:30px;align-content:start}
.stagecol>*{grid-column:1;min-width:0}
@media (max-width:1060px){.stagecol{display:block}}
.src{display:flex;gap:10px;align-items:flex-end;margin-bottom:14px}
.srcf{flex:1;min-width:0}
.srcf label{display:block;font-weight:500;font-size:14px;margin-bottom:5px}
textarea{width:100%;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:4px;padding:10px 12px;font:inherit;resize:vertical;line-height:1.45}
#mem{min-height:48px;max-height:140px}
@media (max-width:560px){.src{flex-direction:column;align-items:stretch}}

/* stage */
.stage{position:relative;width:min(100%,calc(74vh * var(--arn,1.3333)));aspect-ratio:var(--arn,1.3333);margin:0 auto;background:var(--stage);border-radius:3px;overflow:hidden;transition:background .3s}
.view{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.view svg,.view canvas{width:100%;height:100%;object-fit:contain;display:block}
.empty{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:24px;text-align:center;color:#d4cbab}
.empty p{margin:0;max-width:30ch;font-family:var(--serif);font-size:clamp(17px,2.4vw,22px);line-height:1.35}
.stage.drag{outline:2px dashed var(--accent);outline-offset:-8px}
.ov{position:absolute;inset:0;pointer-events:none}

/* frames */
.stage[data-frame=vhs] .ov::before{content:'';position:absolute;inset:0;background:repeating-linear-gradient(to bottom,rgba(0,0,0,.2) 0 1px,transparent 1px 3px);mix-blend-mode:multiply}
.stage[data-frame=vhs] .ov::after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 90px rgba(0,0,0,.45)}
.ov .v{position:absolute;font-family:'VT323',ui-monospace,monospace;font-size:clamp(16px,3.2vw,30px);line-height:1;color:#f4f4f4;text-shadow:0 0 4px rgba(255,255,255,.5),1.5px 0 rgba(255,40,40,.55),-1.5px 0 rgba(40,255,255,.45);z-index:2}
.v-tl{top:5%;left:4%}.v-tr{top:5%;right:4%}.v-bl{bottom:5%;left:4%}.v-br{bottom:5%;right:4%}
.stage[data-frame=polaroid]{background:#f3eee2;box-shadow:0 14px 34px rgba(0,0,0,.28);transform:rotate(-.5deg)}
.stage[data-frame=polaroid] .view{inset:5% 5% 19% 5%;background:var(--stage)}
.stage[data-frame=polaroid] .empty{inset:5% 5% 19% 5%;background:var(--stage)}
.pol{position:absolute;left:7%;right:7%;bottom:5%;font-family:'Caveat',cursive;font-size:clamp(20px,3.8vw,34px);line-height:1.1;color:#3a342a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.placard{position:absolute;left:4%;bottom:5%;width:min(46%,280px);background:#efe9d8;color:#2b2418;padding:10px 12px;box-shadow:0 6px 18px rgba(0,0,0,.35);border:1px solid rgba(40,30,15,.3);display:flex;flex-direction:column;gap:2px;font-size:clamp(10px,1.5vw,13px);line-height:1.3}
.placard b{font-family:var(--serif);font-weight:600;font-size:clamp(12px,1.9vw,16px);margin-bottom:3px}
.placard span{color:#5b4f3a}
@media (prefers-reduced-motion: no-preference){
  .stage.cold::after{content:'';position:absolute;inset:0;pointer-events:none;background:rgba(255,255,220,.05);animation:hum 3.1s steps(1) infinite}
  @keyframes hum{0%{opacity:0}9%{opacity:1}11%{opacity:0}47%{opacity:.4}49%{opacity:0}83%{opacity:1}85%{opacity:.2}100%{opacity:0}}
}

@media (max-width:1060px){
  .stage{width:100%;aspect-ratio:auto;height:clamp(200px,38vh,420px);position:sticky;top:6px;z-index:5;box-shadow:0 0 0 6px var(--bg)}
}

/* stage bar */
.sbar{display:flex;flex-wrap:wrap;gap:12px 18px;align-items:center;justify-content:space-between;margin:16px 0 4px}
.frames{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.flabel{font-size:13px;color:var(--mute);margin-right:4px}
.chip{border:1px solid var(--line);background:none;color:var(--ink);padding:4px 12px;border-radius:999px;font-size:13px;cursor:pointer}
.chip:hover{border-color:var(--ink)}
.chip[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts{display:flex;flex-wrap:wrap;gap:8px}
.cap{font-family:var(--serif);font-size:18px;line-height:1.4;margin:12px 0 0;max-width:62ch;min-height:1.4em}

/* looks, roll */
.sechead{font-family:var(--serif);font-weight:400;font-size:21px;margin:30px 0 10px}
.looks{display:flex;gap:14px;overflow-x:auto;padding:4px 2px 12px;scroll-snap-type:x proximity}
.look{flex:0 0 138px;scroll-snap-align:start;background:none;border:0;padding:0 0 6px;text-align:left;cursor:pointer;border-bottom:2px solid transparent;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}
.look .sw{display:block;height:34px;border-radius:2px;margin-bottom:8px}
.look .ln{display:block;font-size:13.5px;font-weight:500;line-height:1.25}
.look[aria-pressed=true]{border-bottom-color:var(--accent)}
.look:hover .ln{text-decoration:underline}
.rh{display:flex;align-items:baseline;justify-content:space-between;margin-top:30px}
.rh .sechead{margin:0 0 10px}
.thumbs{display:flex;gap:10px;overflow-x:auto;padding-bottom:10px;min-height:20px}
.thumb{position:relative;flex:0 0 112px;aspect-ratio:4/3}
.thumb .open{display:block;width:100%;height:100%;padding:0;border:0;background:var(--stage);cursor:pointer;border-radius:3px;overflow:hidden}
.thumb img{width:100%;height:100%;object-fit:cover;display:block}
.thumb .x{position:absolute;top:4px;right:4px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.62);color:#fff;font-size:14px;line-height:1;cursor:pointer;opacity:0}
.thumb:hover .x,.thumb .x:focus-visible{opacity:1}
@media (hover:none){.thumb .x{opacity:1}}
.note{color:var(--mute);font-size:13.5px;margin:0 0 10px}

/* panel */
.stagecol>.panel{grid-column:2;grid-row:1 / span 9;align-self:start;position:sticky;top:14px;max-height:calc(100vh - 28px);overflow-y:auto;padding-right:4px}
@media (max-width:1060px){.stagecol>.panel{position:static;max-height:none;margin-top:34px}}
.sec{border-top:1px solid var(--line)}
.sec:last-child{border-bottom:1px solid var(--line)}
.sec summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center;padding:14px 2px;font-family:var(--serif);font-size:20px}
.sec summary::-webkit-details-marker{display:none}
.sec summary::after{content:'';width:8px;height:8px;border-right:1.5px solid var(--mute);border-bottom:1.5px solid var(--mute);transform:rotate(45deg);transition:transform .2s;margin-right:4px}
.sec[open] summary::after{transform:rotate(-135deg)}
.secb{padding:2px 2px 14px}
.srow{margin-bottom:18px}
.rl{display:flex;justify-content:space-between;align-items:baseline;font-weight:500;font-size:14px}
.rl output{font-variant-numeric:tabular-nums;color:var(--mute);font-weight:400}
.ends{display:flex;justify-content:space-between;gap:10px;font-size:12.5px;color:var(--mute);margin-top:1px}
.row{display:flex;align-items:center;gap:12px;margin-top:10px}
#prompt{font-size:13.5px}

/* range */
input[type=range]{--p:50%;-webkit-appearance:none;appearance:none;width:100%;height:24px;background:transparent;margin:2px 0;cursor:pointer}
input[type=range]::-webkit-slider-runnable-track{height:4px;border-radius:2px;background:linear-gradient(to right,var(--accent) var(--p),var(--line) var(--p))}
input[type=range]::-moz-range-track{height:4px;border-radius:2px;background:var(--line)}
input[type=range]::-moz-range-progress{height:4px;border-radius:2px;background:var(--accent)}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:16px;height:16px;border-radius:50%;background:var(--ink);border:2px solid var(--bg);margin-top:-6px}
input[type=range]::-moz-range-thumb{width:12px;height:12px;border-radius:50%;background:var(--ink);border:2px solid var(--bg)}

/* toast, sheet */
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:4px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90vw;text-align:center;z-index:30}
.toast.on{opacity:1}
.sheet{position:fixed;inset:0;background:rgba(10,8,4,.82);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:20px;z-index:20}
.sheet img{max-width:100%;max-height:72vh;border-radius:3px;display:block}
.sheet p{margin:0;color:#e8dfc6;text-align:center}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <div>
      <h1 class="mark">Remnant</h1>
      <p class="tag">Memories, as they come back wrong.</p>
    </div>
    <div class="bar-act">
      <button class="btn" id="dream" type="button">Dream</button>
      <button class="btn ghost" id="reset" type="button">Reset</button>
    </div>
  </header>

  <nav class="rooms" role="tablist" aria-label="Rooms">
    <button class="room" role="tab" data-tab="text" aria-selected="true" type="button">
      <svg viewBox="0 0 28 28" aria-hidden="true"><path d="M6 22 L22 6"/><path d="M22 6 c2 4 -2 9 -9 11"/><path d="M6 22 l1.5 -4.5 3 3z"/></svg><span>Words</span>
    </button>
    <button class="room" role="tab" data-tab="photo" aria-selected="false" type="button">
      <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="4" y="6" width="20" height="16" rx="1.5"/><circle cx="14" cy="14" r="4"/><path d="M9 6 l1.5 -2.5 h7 l1.5 2.5"/></svg><span>Photo</span>
    </button>
    <button class="room" role="tab" data-tab="video" aria-selected="false" type="button">
      <svg viewBox="0 0 28 28" aria-hidden="true"><rect x="4" y="5" width="20" height="18" rx="1.5"/><path d="M4 10h20M4 18h20M9 5v18M19 5v18"/></svg><span>Video</span>
    </button>
    <button class="room" role="tab" data-tab="mirror" aria-selected="false" type="button">
      <svg viewBox="0 0 28 28" aria-hidden="true"><ellipse cx="14" cy="12" rx="8" ry="9.5"/><path d="M9 24 h10M14 21.5 V24"/><path d="M10.5 9 c1-1.5 3-2 4.5-1.4"/></svg><span>Mirror</span>
    </button>
  </nav>

  <main class="stagecol">
    <div class="src">
      <div class="srcf">
        <label for="mem" id="mem-lab">What are you remembering?</label>
        <textarea id="mem" rows="2"></textarea>
      </div>
      <button class="btn" id="act" type="button">Remember</button>
    </div>

    <div class="stage" id="stage" data-frame="clean">
      <div class="view" id="view-text"></div>
      <div class="view" id="view-photo" hidden><canvas id="photoCv"></canvas></div>
      <div class="view" id="view-video" hidden><canvas id="vidOut"></canvas></div>
      <div class="empty" id="empty"><p id="empty-msg"></p></div>
      <div class="ov" id="ov"></div>
    </div>

    <div class="sbar">
      <div class="frames" role="group" aria-label="Frame">
        <span class="flabel">Frame</span>
        <button class="chip" type="button" data-frame="clean" aria-pressed="true">Clean</button>
        <button class="chip" type="button" data-frame="vhs" aria-pressed="false">VHS</button>
        <button class="chip" type="button" data-frame="polaroid" aria-pressed="false">Polaroid</button>
        <button class="chip" type="button" data-frame="placard" aria-pressed="false">Museum label</button>
      </div>
      <div class="acts">
        <button class="btn ghost" id="shuffle" type="button">Shuffle</button>
        <button class="btn ghost" id="hold" data-rooms="photo video mirror" type="button" hidden>Hold to compare</button>
        <button class="btn ghost" id="playBtn" data-rooms="video" type="button" hidden>Pause</button>
        <button class="btn ghost" id="recBtn" data-rooms="video mirror" type="button" hidden>Record</button>
        <button class="btn ghost" id="keep" type="button">Keep</button>
        <button class="btn" id="save" type="button">Save image</button>
      </div>
    </div>
    <p class="cap" id="cap" aria-live="polite"></p>

    <h2 class="sechead">Looks</h2>
    <div class="looks" id="looks"></div>

    <div class="rh">
      <h2 class="sechead">Kept</h2>
      <button class="link" id="clearRoll" type="button">Clear all</button>
    </div>
    <div class="thumbs" id="thumbs"></div>
    <aside class="panel" id="panel" aria-label="Controls"></aside>
  </main>
</div>

<input type="file" id="photoIn" accept="image/*" hidden>
<input type="file" id="vidIn" accept="video/*" hidden>
<video id="vid" muted loop playsinline style="display:none"></video>
<div class="toast" id="toast" role="status"></div>
<div class="sheet" id="sheet" hidden>
  <img id="sheetImg" alt="Your image">
  <p>Press and hold the image (or right-click it) to save.</p>
  <button class="btn" id="sheetClose" type="button">Close</button>
</div>

<script>
const $=s=>document.querySelector(s);
const $$=s=>[...document.querySelectorAll(s)];
const state={tab:'text',mood:.1,fade:.4,drift:.2,tilt:.12,grav:.05,echo:.1,faces:.15,eyes:.1,twist:.05,melt:.15,zoom:.15,sick:.05,wax:.2,noodle:.1,variant:0,text:'',frame:'clean',look:null,compare:false,dirty:false};

/* ---------- helpers ---------- */
function hash(str){let h=2166136261;for(let i=0;i<str.length;i++){h^=str.charCodeAt(i);h=Math.imul(h,16777619)}return h>>>0}
function rng(seed){let a=seed>>>0;return()=>{a=(a+0x6D2B79F5)|0;let t=Math.imul(a^(a>>>15),1|a);t=(t+Math.imul(t^(t>>>7),61|t))^t;return((t^(t>>>14))>>>0)/4294967296}}
function h2r(h){h=h.replace('#','');return[parseInt(h.slice(0,2),16),parseInt(h.slice(2,4),16),parseInt(h.slice(4,6),16)]}
function mix(a,b,t){const A=h2r(a),B=h2r(b);return'#'+A.map((v,i)=>Math.round(v+(B[i]-v)*t).toString(16).padStart(2,'0')).join('')}
const seed=()=>hash(state.text||'nothing')+state.variant*7919;
const P=()=>({drift:state.drift,tilt:state.tilt,grav:state.grav,echo:state.echo});
const C=()=>({faces:state.faces,eyes:state.eyes,twist:state.twist});
const U=()=>({melt:state.melt,zoom:state.zoom,sick:state.sick,wax:state.wax,noodle:state.noodle});

/* ---------- object library (origin = bottom centre, sits on the surface) ---------- */
const OBJ={
 cup:c=>`<path d="M-30,-60 h60 l-6,56 q-24,8 -48,0z" fill="${c.a}"/><ellipse cx="0" cy="-60" rx="30" ry="8" fill="${c.d}"/><path d="M30,-48 q26,0 22,22 q-4,16 -26,12" fill="none" stroke="${c.a}" stroke-width="8"/>`,

function buildPrompt(){

 const tone=m<.35?warm:m>.65?cold:warm+', turning slowly into '+cold;
 const wrong=[];if(state.drift>.25)wrong.push('objects not where they belong, shifted off their surfaces');if(state.grav>.25)wrong.push('some objects floating slightly above the table');if(state.tilt>.25)wrong.push('wrong scale and slightly rotated, perspective that does not add up');if(state.echo>.25)wrong.push('faint duplicates of the same object repeating around the room');if(state.faces>.25)wrong.push('more faces than there should be, duplicated and overlapping');if(state.eyes>.25)wrong.push('faces with the wrong number of eyes, none at all or three or more, eyes in the wrong places');if(state.twist>.25)wrong.push('everything twisted and swirled, spiralling distortion, warped like a wrung cloth');if(state.melt>.25)wrong.push('shapes melting and wobbling, wavering outlines, lettering running into garbled shapes');if(state.sick>.25)wrong.push('sickly yellow-olive colour cast over everything');if(state.zoom>.25)wrong.push('cropped in too close, framing slightly off');if(state.wax>.25)wrong.push('waxy plastic skin, over-smoothed glossy surfaces, dreamy bloom, the look of an AI-generated image from 2023');if(state.noodle>.25)wrong.push('fine details dissolving into squiggly noodle-like shapes, garbled text, malformed fingers and objects');const misplaced=wrong.length?wrong.join(', ')+'. ':'';

}

/* ---------- small helpers ---------- */

function setAR(w,h){if(w&&h)$('#stage').style.setProperty('--arn',(w/h).toFixed(4))}
function setMood(){document.documentElement.style.setProperty('--m',state.mood.toFixed(3));$('#stage').classList.toggle('cold',state.mood>.6)}
function stamp(){return new Date().toISOString().slice(0,19).replace(/[:T]/g,'-')}
function fmtDate(){return new Date().toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}).toUpperCase()}
function isEmpty(){
 const t=state.tab;
 if(t==='text')return !state.text.trim();

 return !cam;
}

function updateButtons(){

 $$('[data-rooms]').forEach(el=>el.hidden=!el.dataset.rooms.split(' ').includes(t));

/* ---------- controls panel ---------- */

  h+='<details class="sec"'+(gi===0||g==='Unease'?' open':'')+'><summary>'+g+'</summary><div class="secb">';
  SL.filter(s=>s.g===g).forEach(s=>{
   h+='<div class="srow"><div class="rl"><label for="s-'+s.k+'">'+s.l+'</label><output id="o-'+s.k+'"></output></div>'+
      '<input type="range" id="s-'+s.k+'" min="0" max="100" step="1">'+
      '<div class="ends"><span>'+s.a+'</span><span>'+s.b+'</span></div></div>';
  });
  h+='</div></details>';
 });
 h+='<details class="sec"><summary>Prompt for an image model</summary><div class="secb">'+
    '<p class="note">This page paints with shapes. For photoreal results, paste this into Midjourney, Flux or DALL\u00b7E.</p>'+
    '<textarea id="prompt" readonly aria-label="Generated prompt" rows="8"></textarea>'+
    '<div class="row"><button class="btn" id="copy" type="button">Copy prompt</button><span class="note" id="copied" role="status" style="margin:0"></span></div></div></details>';
 $('#panel').innerHTML=h;
 SL.forEach(s=>$('#s-'+s.k).addEventListener('input',e=>onSlide(s.k,+e.target.value)));

function paintSlider(k){

function syncSliders(){SLK.forEach(paintSlider)}
function onSlide(k,v){state[k]=v/100;state.look=null;paintSlider(k);markLooks();scheduleRender()}

async function copyPrompt(){

}
function refreshPrompt(){const p=$('#prompt');if(p)p.value=buildPrompt()}

/* ---------- looks ---------- */
function swatch(v){
 const f=c=>mix(c,'#cfc561',v.sick*.4);
 const w=f(mix('#f0d9ae','#e4e08a',v.mood)),t=f(mix('#8a5a34','#908a50',v.mood)),o=f(mix('#c8553d','#b5ad6a',v.mood));
 return 'linear-gradient(90deg,'+w+' 0 46%,'+o+' 46% 64%,'+t+' 64% 100%)';
}
function buildLooks(){
 $('#looks').innerHTML=LOOKS.map((l,i)=>'<button class="look" type="button" data-i="'+i+'" aria-pressed="false"><span class="sw" style="background:'+swatch(l.v)+'"></span><span class="ln">'+esc(l.n)+'</span></button>').join('');

}
function markLooks(){$$('.look').forEach((b,i)=>b.setAttribute('aria-pressed',state.look===i))}
function applyLook(i){Object.assign(state,LOOKS[i].v);state.look=i;syncSliders();markLooks();render()}
function dream(){
 const r=Math.random;
 state.mood=r();state.fade=.25+r()*.6;
 SLK.filter(k=>k!=='mood'&&k!=='fade').forEach(k=>state[k]=Math.pow(r(),1.4));
 state.variant++;state.look=null;syncSliders();markLooks();render();
}
function resetAll(){
 SLK.forEach(k=>state[k]=0);state.mood=.3;state.fade=.45;state.look=null;state.compare=false;

}

/* ---------- frames (on-screen overlay) ---------- */
function frameInfo(){
 const t=state.text.trim().replace(/\s+/g,' ');
 const title=t?(t.length>46?t.slice(0,44).trim()+'\u2026':t).replace(/^./,c=>c.toUpperCase()):'Untitled';
 const h=hash(t||'untitled');
 return{title,media:MEDIA[h%MEDIA.length],no:String(1+h%88).padStart(2,'0'),left:Math.round((1-state.fade)*100)+'%'};
}
function refreshOverlay(){
 const f=state.frame,i=frameInfo(),ov=$('#ov');
 $('#stage').dataset.frame=f;
 if(f==='vhs')ov.innerHTML='<span class="v v-tl">PLAY \u25B6</span><span class="v v-tr">SP</span><span class="v v-bl">'+fmtDate()+'</span><span class="v v-br" id="vctr">0:00:07</span>';
 else if(f==='polaroid')ov.innerHTML='<span class="pol">'+esc(i.title)+'</span>';
 else if(f==='placard')ov.innerHTML='<div class="placard"><b>'+esc(i.title)+'</b><span>Recollection no. '+i.no+'</span><span>'+esc(i.media)+'</span><span>'+i.left+' retained</span></div>';
 else ov.innerHTML='';
}
function setFrame(f){
 state.frame=f;
 $$('.chip').forEach(c=>c.setAttribute('aria-pressed',c.dataset.frame===f));
 refreshOverlay();
}
const T0=Date.now();
setInterval(()=>{const el=$('#vctr');if(el){const s=Math.floor((Date.now()-T0)/1000)+7;el.textContent=Math.floor(s/3600)+':'+String(Math.floor(s/60)%60).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}},1000);

/* ---------- rendering by room ---------- */
function roomCaption(){
 if(state.tab==='text'||isEmpty())return '';
 const who={photo:'The photo',video:'The clip',mirror:'The room'}[state.tab];
 const left=Math.round((1-state.fade)*100);
 let s=who+' remembers '+left+'% of itself.';
 if(state.drift+state.grav+state.tilt+state.echo>.5)s+=' Nothing is quite where it was.';
 if(state.faces>.12||state.eyes>.12)s+=state.tab==='mirror'?' You have changed.':' Anyone in it has changed.';
 return s;
}
function render(){
 setMood();
 if(state.tab==='text')renderText();
 else if(state.tab==='photo')renderPhoto();
 else state.dirty=true;
 showEmpty();refreshPrompt();refreshOverlay();updateButtons();
 if(state.tab!=='text')$('#cap').textContent=roomCaption();
}
function renderText(){
 const v=$('#view-text');
 if(!state.text.trim()){v.innerHTML='';$('#cap').textContent='';return}
 const sc=buildScene(state.text,state.mood,state.fade,seed(),P(),C(),U());
 v.innerHTML=sc.svg;state.lastSvg=sc.svg;state.names=sc.names;$('#cap').textContent=sc.cap;setAR(4,3);
}
function renderPhoto(){
 const im=photo.im;if(!im)return;
 setAR(im.naturalWidth,im.naturalHeight);
 if(state.compare){
  const k=Math.min(1,900/Math.max(im.naturalWidth,im.naturalHeight));
  photoCv.width=Math.round(im.naturalWidth*k);photoCv.height=Math.round(im.naturalHeight*k);
  photoCv.getContext('2d').drawImage(im,0,0,photoCv.width,photoCv.height);return;
 }
 processFrame(im,im.naturalWidth,im.naturalHeight,photoCv,{maxW:900,F:state.fade,m:state.mood,ghost:0,fl:1,seed:seed(),P:P(),t:0,C:C(),U:U(),faces:photo.faces});
}

/* video + camera share one loop */
function startLoop(){cancelAnimationFrame(raf);raf=requestAnimationFrame(vloop)}
function vloop(t){
 if(state.tab!=='video'&&state.tab!=='mirror')return;
 if(vid.readyState>=2&&vid.videoWidth&&(!vid.paused||state.dirty)){
  state.dirty=false;
  const vw=vid.videoWidth,vh=vid.videoHeight;
  if(state.compare){
   const k=Math.min(1,520/Math.max(vw,vh)),W=Math.round(vw*k),H=Math.round(vh*k);
   if(vout.width!==W||vout.height!==H){vout.width=W;vout.height=H}
   vout.getContext('2d').drawImage(vid,0,0,W,H);
  }else{
   const F=state.fade+.07*Math.sin(t/2200),m=state.mood;
   if(FD&&state.tab==='video'&&t-lastFD>300){lastFD=t;detectFaces(vid,f=>{vfaces=f})}
   const flick=m>.4?1-(Math.random()<.07?.06+Math.random()*.1:0)-.015*Math.sin(t/60):1;
   processFrame(vid,vw,vh,vout,{maxW:520,F,m,ghost:.5*state.fade,fl:flick,seed:seed(),P:P(),t,C:C(),U:U(),faces:state.tab==='video'?vfaces:null,maxBlobs:4});
  }
 }
 raf=requestAnimationFrame(vloop);
}
function loadVideo(f){
 stopCamera(true);
 if(vurl)URL.revokeObjectURL(vurl);
 vurl=URL.createObjectURL(f);vfaces=null;
 vid.onerror=()=>{toast('This clip could not be played here. Try an MP4 (H.264) or a shorter file.');vurl=null;showEmpty();updateButtons()};
 vid.onloadeddata=()=>{setAR(vid.videoWidth,vid.videoHeight);vid.play().catch(()=>{});startLoop();$('#playBtn').textContent='Pause';showEmpty();updateButtons()};
 vid.srcObject=null;vid.src=vurl;
 if(state.tab!=='video')switchTab('video');
}
async function startCamera(){
 try{
  const s=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'},audio:false});
  cam=s;vid.onerror=null;vid.removeAttribute('src');vid.srcObject=s;
  vid.onloadeddata=()=>{setAR(vid.videoWidth,vid.videoHeight);startLoop();showEmpty();updateButtons()};
  await vid.play();showEmpty();updateButtons();
 }catch(e){toast('The camera isn\u2019t available here. Allow access, or use a video file instead.')}
}
function stopCamera(quiet){
 if(cam){cam.getTracks().forEach(t=>t.stop());cam=null}
 if(vid.srcObject)vid.srcObject=null;
 if(!quiet){showEmpty();updateButtons()}
}
function loadPhoto(f){
 const fr=new FileReader();
 fr.onload=()=>{
  const im=new Image();
  im.onload=()=>{
   photo.im=im;photo.faces=null;state.compare=false;
   if(state.tab!=='photo')switchTab('photo');else render();
   detectFaces(im,fc=>{photo.faces=fc;renderPhoto()});
  };
  im.onerror=()=>toast('That image could not be opened.');
  im.src=fr.result;
 };
 fr.readAsDataURL(f);
}
function handleFile(f){
 if(!f)return;
 if(f.type.startsWith('image/'))loadPhoto(f);
 else if(f.type.startsWith('video/'))loadVideo(f);
 else toast('That file is not a photo or a video.');
}

/* ---------- rooms ---------- */
function switchTab(t){
 state.tab=t;state.compare=false;
 $$('.room').forEach(b=>b.setAttribute('aria-selected',b.dataset.tab===t));
 const R=ROOMS[t];
 $('#mem-lab').textContent=R.lab;$('#mem').placeholder=R.ph;
 $('#view-text').hidden=t!=='text';$('#view-photo').hidden=t!=='photo';$('#view-video').hidden=!(t==='video'||t==='mirror');
 vout.style.transform=t==='mirror'?'scaleX(-1)':'';
 if(t!=='mirror')stopCamera(true);
 if(t==='video'||t==='mirror'){if(t==='video'&&vurl&&vid.videoWidth){vid.play().catch(()=>{});setAR(vid.videoWidth,vid.videoHeight)}startLoop()}
 else{vid.pause();cancelAnimationFrame(raf)}
 if(t==='text')setAR(4,3);
 render();
}

/* ---------- export ---------- */
function svgToCanvas(svg,w,h){
 return new Promise((res,rej)=>{
  const img=new Image();
  img.onload=()=>{const c=document.createElement('canvas');c.width=w;c.height=h;c.getContext('2d').drawImage(img,0,0,w,h);res(c)};
  img.onerror=()=>rej(new Error('svg'));
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg.replace('<svg ','<svg width="'+w+'" height="'+h+'" '));
 });
}
function copyCanvas(src){const c=document.createElement('canvas');c.width=src.width;c.height=src.height;c.getContext('2d').drawImage(src,0,0);return c}
async function currentBase(){
 const t=state.tab;
 if(t==='text'){if(!state.lastSvg||!state.text.trim())return null;return svgToCanvas(state.lastSvg,1600,1200)}
 if(t==='photo')return photo.im?copyCanvas(photoCv):null;
 return(vid.videoWidth&&vout.width)?copyCanvas(vout):null;
}
function bake(base){
 const W=base.width,H=base.height,f=state.frame,i=frameInfo();
 if(f==='polaroid'){
  const b=Math.round(W*.05),cap=Math.round(W*.15),c=document.createElement('canvas');
  c.width=W+b*2;c.height=H+b+cap;
  const x=c.getContext('2d');x.fillStyle='#f3eee2';x.fillRect(0,0,c.width,c.height);x.drawImage(base,b,b);
  x.fillStyle='#3a342a';x.font=Math.round(W*.05)+'px Caveat,cursive';x.textBaseline='middle';x.fillText(i.title,b,H+b+cap*.5,W);
  return c;
 }
 const c=document.createElement('canvas');c.width=W;c.height=H;
 const x=c.getContext('2d');x.drawImage(base,0,0);
 if(f==='vhs'){
  const step=Math.max(3,Math.round(H/200));x.fillStyle='rgba(0,0,0,.2)';
  for(let y=0;y<H;y+=step)x.fillRect(0,y,W,Math.max(1,step/3));
  const fs=Math.round(H*.065);x.font=fs+'px VT323,monospace';x.fillStyle='#f4f4f4';x.shadowColor='rgba(255,255,255,.5)';x.shadowBlur=4;
  x.textBaseline='top';x.textAlign='left';x.fillText('PLAY \u25B6',W*.04,H*.05);
  x.textAlign='right';x.fillText('SP',W*.96,H*.05);
  x.textBaseline='bottom';x.fillText('0:00:07',W*.96,H*.95);
  x.textAlign='left';x.fillText(fmtDate(),W*.04,H*.95);x.shadowBlur=0;
 }else if(f==='placard'){
  const cw=Math.round(W*.36),ch=Math.round(H*.2),px=Math.round(W*.04),py=H-ch-Math.round(H*.05),fs=Math.round(ch*.2),tx=px+fs*.7,mw=cw-fs*1.4;
  x.fillStyle='#efe9d8';x.fillRect(px,py,cw,ch);x.strokeStyle='rgba(40,30,15,.35)';x.strokeRect(px+.5,py+.5,cw-1,ch-1);
  x.textBaseline='top';x.fillStyle='#2b2418';x.font='600 '+fs+'px Fraunces,Georgia,serif';x.fillText(i.title,tx,py+fs*.6,mw);
  x.fillStyle='#5b4f3a';x.font=Math.round(fs*.8)+'px Figtree,sans-serif';
  x.fillText('Recollection no. '+i.no,tx,py+fs*1.8,mw);x.fillText(i.media,tx,py+fs*2.7,mw);x.fillText(i.left+' retained',tx,py+fs*3.6,mw);
 }
 return c;
}
async function getDownloads(){
 if(dl!==undefined)return dl;
 try{dl=(window.claude&&window.claude.use)?await window.claude.use('downloads'):null}catch(e){dl=null}
 return dl;
}
function showSheet(c){$('#sheetImg').src=c.toDataURL('image/png');$('#sheet').hidden=false}
async function saveStill(){
 let base=null;try{base=await currentBase()}catch(e){}
 if(!base){toast('Could not capture this one. Try again.');return}
 const out=bake(base),d=await getDownloads();
 if(!d){showSheet(out);return}
 out.toBlob(async b=>{
  if(!b){showSheet(out);return}
  try{await d.save({filename:'remnant-'+stamp()+'.png',data:b});toast('Saved.')}
  catch(e){if(!e||e.code!=='declined')showSheet(out)}
 },'image/png');
}
function toggleRecord(){
 const btn=$('#recBtn');
 if(rec){rec.stop();return}
 if(!vout.captureStream||!window.MediaRecorder||!vout.width){toast('Recording is not available here.');return}
 const mime=['video/webm;codecs=vp9','video/webm;codecs=vp8','video/webm'].find(t=>MediaRecorder.isTypeSupported(t));
 chunks=[];
 try{rec=new MediaRecorder(vout.captureStream(30),mime?{mimeType:mime}:undefined)}catch(e){rec=null;toast('Recording is not available here.');return}
 rec.ondataavailable=e=>{if(e.data&&e.data.size)chunks.push(e.data)};
 rec.onstop=async()=>{
  rec=null;btn.textContent='Record';btn.classList.remove('rec');
  const d=await getDownloads();if(!d||!chunks.length)return;
  try{await d.save({filename:'remnant-'+stamp()+'.webm',data:new Blob(chunks,{type:'video/webm'})});toast('Saved. The video does not include the frame.')}
  catch(e){if(!e||e.code!=='declined')toast('Could not save the recording.')}
 };
 rec.start();btn.textContent='Stop';btn.classList.add('rec');
 setTimeout(()=>{if(rec&&rec.state==='recording')rec.stop()},20000);
}

/* ---------- kept roll ---------- */
function loadRoll(){try{roll=JSON.parse(localStorage.getItem(RK)||'[]')||[]}catch(e){roll=[]}}
function saveRoll(){
 for(let n=0;n<6;n++){try{localStorage.setItem(RK,JSON.stringify(roll));return}catch(e){if(!roll.length)return;roll.pop()}}
}
function drawRoll(){
 const el=$('#thumbs');
 if(!roll.length){el.innerHTML='<p class="note" style="margin:0">Nothing kept yet. Press Keep to save a look.</p>';$('#clearRoll').hidden=true;return}
 $('#clearRoll').hidden=false;
 el.innerHTML=roll.map(it=>'<div class="thumb"><button class="open" type="button" data-id="'+it.id+'" aria-label="Restore this look"><img src="'+it.thumb+'" alt=""></button><button class="x" type="button" data-del="'+it.id+'" aria-label="Remove">\u00d7</button></div>').join('');
}
async function keep(){
 let base=null;try{base=await currentBase()}catch(e){}
 if(!base){toast('Could not capture this one. Try again.');return}
 const k=360/base.width,t=document.createElement('canvas');t.width=360;t.height=Math.max(1,Math.round(base.height*k));
 t.getContext('2d').drawImage(base,0,0,t.width,t.height);
 const s={};SLK.forEach(x=>s[x]=state[x]);
 roll.unshift({id:Date.now(),thumb:t.toDataURL('image/jpeg',.78),tab:state.tab,text:state.text,s,frame:state.frame,variant:state.variant});
 roll=roll.slice(0,14);saveRoll();drawRoll();toast('Kept.');
}
function restore(it){
 Object.assign(state,it.s,{variant:it.variant,look:null,text:it.text});
 $('#mem').value=it.text;
 setFrame(it.frame);
 syncSliders();markLooks();
 switchTab(it.tab==='mirror'?'video':it.tab);
 toast('Look restored.');
}

/* ---------- events ---------- */
function bindEvents(){
 $$('.room').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
 $('#act').addEventListener('click',()=>{
  const t=state.tab;
  if(t==='text'){state.text=$('#mem').value;render()}
  else if(t==='photo')$('#photoIn').click();
  else if(t==='video')$('#vidIn').click();
  else if(cam)stopCamera();
  else startCamera();
 });
 $('#mem').addEventListener('input',e=>{state.text=e.target.value;refreshPrompt();refreshOverlay()});
 $('#mem').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey)&&state.tab==='text'){state.text=$('#mem').value;render()}});
 $('#photoIn').addEventListener('change',e=>{handleFile(e.target.files[0]);e.target.value=''});
 $('#vidIn').addEventListener('change',e=>{handleFile(e.target.files[0]);e.target.value=''});
 const st=$('#stage');
 st.addEventListener('dragover',e=>{e.preventDefault();st.classList.add('drag')});
 st.addEventListener('dragleave',()=>st.classList.remove('drag'));
 st.addEventListener('drop',e=>{e.preventDefault();st.classList.remove('drag');handleFile(e.dataTransfer.files[0])});
 $$('.chip').forEach(c=>c.addEventListener('click',()=>setFrame(c.dataset.frame)));
 $('#dream').addEventListener('click',dream);
 $('#reset').addEventListener('click',resetAll);
 $('#shuffle').addEventListener('click',()=>{state.variant++;render()});
 const hold=$('#hold');
 const holdOn=()=>{state.compare=true;if(state.tab==='photo')renderPhoto();else state.dirty=true};
 const holdOff=()=>{if(!state.compare)return;state.compare=false;if(state.tab==='photo')renderPhoto();else state.dirty=true};
 hold.addEventListener('pointerdown',holdOn);
 ['pointerup','pointerleave','pointercancel'].forEach(ev=>hold.addEventListener(ev,holdOff));
 hold.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();holdOn()}});
 hold.addEventListener('keyup',holdOff);
 $('#playBtn').addEventListener('click',()=>{if(vid.paused){vid.play();$('#playBtn').textContent='Pause'}else{vid.pause();$('#playBtn').textContent='Play'}});
 $('#recBtn').addEventListener('click',toggleRecord);
 $('#keep').addEventListener('click',keep);
 $('#save').addEventListener('click',saveStill);
 $('#thumbs').addEventListener('click',e=>{
  const d=e.target.closest('[data-del]');
  if(d){roll=roll.filter(r=>String(r.id)!==d.dataset.del);saveRoll();drawRoll();return}
  const o=e.target.closest('.open');
  if(o){const it=roll.find(r=>String(r.id)===o.dataset.id);if(it)restore(it)}
 });
 $('#clearRoll').addEventListener('click',()=>{roll=[];saveRoll();drawRoll()});
 const close=()=>{$('#sheet').hidden=true};
 $('#sheetClose').addEventListener('click',close);
 $('#sheet').addEventListener('click',e=>{if(e.target.id==='sheet')close()});
 document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});
}

/* ---------- start ---------- */
function boot(){
 buildPanel();buildLooks();loadRoll();drawRoll();
 state.text='my grandmother\u2019s kitchen on a Sunday';
 $('#mem').value=state.text;
 bindEvents();
 applyLook(0);
 switchTab('text');
 getDownloads().then(d=>{canDl=!!d;updateButtons()});
}
boot();

</script>
</body>
</html>
